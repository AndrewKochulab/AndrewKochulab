name: Refresh profile assets

on:
  schedule:
    # Daily at 04:17 UTC (about 07:17 in Kyiv).
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    name: Fetch stats and rebuild SVGs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fetch GitHub stats
        run: npm run fetch
        env:
          # PROFILE_TOKEN (optional, classic PAT with read:user + repo) sees private contributions;
          # GITHUB_TOKEN is the fallback and only sees public data.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run build
      - run: npm run readme
      # The repository keeps a single commit: refreshed assets are folded into
      # it and force-pushed, so the history never fills with daily bot commits.
      - name: Fold changes into the single commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets data/stats.json README.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit --amend --no-edit
            git push --force-with-lease
          fi
