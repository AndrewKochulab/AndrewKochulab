<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 152 66" width="152" height="66" role="img" aria-label="LinkedIn: https://www.linkedin.com/in/andrewkochulab"><title>LinkedIn: https://www.linkedin.com/in/andrewkochulab</title><style>@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spin-reverse{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes sweep{0%{transform:translateX(var(--from))}55%,100%{transform:translateX(var(--to))}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(var(--dx),var(--dy)) scale(1.08)}}
.a-rise{opacity:0;animation:rise 800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.a-fade{opacity:0;animation:fade 800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.a-pop{opacity:0;animation:pop 800ms cubic-bezier(0.16, 1, 0.3, 1) both;transform-box:fill-box;transform-origin:center}
.a-spin{animation:spin var(--orbit,24000ms) linear infinite;transform-box:view-box;transform-origin:0 0}
.a-spin-reverse{animation:spin-reverse var(--orbit,24000ms) linear infinite;transform-box:view-box;transform-origin:0 0}
.a-pulse{animation:pulse var(--period,7000ms) cubic-bezier(0.45, 0, 0.55, 1) infinite}
.a-float{animation:float var(--period,7000ms) cubic-bezier(0.45, 0, 0.55, 1) infinite}
.a-draw{stroke-dashoffset:var(--len);animation:draw var(--dur,1400ms) cubic-bezier(0.16, 1, 0.3, 1) both}
.a-sweep{animation:sweep var(--period,9000ms) cubic-bezier(0.45, 0, 0.55, 1) infinite}
.a-blink{animation:blink 1s step-end infinite}
.a-drift{animation:drift var(--period,16000ms) cubic-bezier(0.45, 0, 0.55, 1) infinite;transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:reduce){.a-rise,.a-fade,.a-pop{animation:none;opacity:1;transform:none}.a-draw{animation:none;stroke-dashoffset:0}.a-spin,.a-spin-reverse,.a-pulse,.a-float,.a-sweep,.a-blink,.a-drift{animation:none}}</style><defs><linearGradient id="brand-linkedin" x1="0" y1="0.5" x2="1" y2="0.5"><stop offset="0" stop-color="#0a66c2"/><stop offset="1" stop-color="#0a66c2"/></linearGradient><linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient><filter id="shadow" x="-20%" y="-40%" width="140%" height="200%"><feGaussianBlur stdDeviation="5"/></filter><clipPath id="button-clip"><rect width="132" height="46" rx="23"/></clipPath></defs><g transform="translate(10 10)"><g class="a-pop" style="animation-delay:80ms"><rect width="132" height="46" rx="23" y="4" fill="#0a66c2" opacity="0.5" filter="url(#shadow)"/><rect width="132" height="46" rx="23" fill="url(#brand-linkedin)"/><rect width="132" height="46" rx="23" fill="url(#sheen)"/><rect x="0.5" y="0.5" width="131" height="45" rx="22.5" fill="none" stroke="#ffffff" stroke-opacity="0.25"/><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z" fill="#ffffff" transform="translate(20 13) scale(0.833)"/><path d="M7.87 0L1.1 0L1.1-10.91L3.05-10.91L3.05-1.65L7.87-1.65L7.87 0M11.4 0L9.49 0L9.49-8.19L11.4-8.19L11.4 0M10.44-9.35L10.44-9.35Q9.99-9.35 9.66-9.65Q9.34-9.95 9.34-10.39L9.34