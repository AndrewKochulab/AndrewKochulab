<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 163 66" width="163" height="66" role="img" aria-label="Instagram: https://www.instagram.com/andrewkochulab"><title>Instagram: https://www.instagram.com/andrewkochulab</title><style>@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spin-reverse{to{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes sweep{0%{transform:translateX(var(--from))}55%,100%{transform:translateX(var(--to))}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(var(--dx),var(--dy)) scale(1.08)}}
.a-rise{opacity:0;animation:rise 800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.a-fade{opacity:0;animation:fade 800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.a-pop{opacity:0;animation:pop 800ms cubic-bezier(0.16, 1, 0.3, 1) both;transform-box:fill-box;transform-origin:center}
.a-spin{animation:spin var(--orbit,24000ms) linear infinite;transform-box:view-box;transform-origin:0 0}
.a-spin-reverse{animation:spin-reverse var(--orbit,24000ms) linear infinite;transform-box:view-box;transform-origin:0 0}
.a-pulse{animation:pulse var(--period,7000ms) cubic-bezier(0.45, 0, 0.55, 1) infinite}
.a-float{animation:float var(--period,7000ms) cubic-bezier(0.45, 0, 0.55, 1) infinite}
.a-draw{stroke-dashoffset:var(--len);animation:draw var(--dur,1400ms) cubic-bezier(0.16, 1, 0.3, 1) both}
.a-sweep{animation:sweep var(--period,9000ms) cubic-bezier(0.45, 0, 0.55, 1) infinite}
.a-blink{animation:blink 1s step-end infinite}
.a-drift{animation:drift var(--period,16000ms) cubic-bezier(0.45, 0, 0.55, 1) infinite;transform-box:fill-box;transform-origin:center}
